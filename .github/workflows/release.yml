name: Release

# Tag a commit (e.g. `git tag v0.2.0 && git push --tags`) to fire this
# workflow. It builds the universal macOS DMG (ad-hoc signed) and the
# Windows NSIS installer, and attaches both to a GitHub release for that
# tag. It can also be run manually (workflow_dispatch) to smoke-test the
# builds — installers are then uploaded as workflow artifacts instead of
# a release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    # Present only once the updater signing key is configured as a repo secret.
    # While unset, build-macos.sh skips updater artifacts and the steps guarded
    # on this variable below are no-ops, so the build is unchanged.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      # The cargo target dir is cached, so bundles from previous runs (older
      # versions) may be restored with it. Clear them so the upload globs
      # below only ever match this build's output.
      - name: Remove stale bundle output
        run: rm -rf src-tauri/target/universal-apple-darwin/release/bundle

      - name: Build universal DMG
        run: ./build-macos.sh

      - name: Upload DMG to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          fail_on_unmatched_files: true

      # The updater downloads the .app.tar.gz (not the DMG), so it must be a
      # release asset for latest.json to point at. Only produced when signing.
      - name: Upload macOS updater artifact to release
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
          fail_on_unmatched_files: true

      # Hand the detached signature to the manifest job (latest.json embeds its
      # contents, not a URL).
      - name: Stash macOS updater signature
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: updater-sig-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

      - name: Upload DMG as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: HymnBeam-macOS-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    # See build-macos: unset until the signing key secret exists, at which point
    # the NSIS build emits updater artifacts and the guarded steps activate.
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked

      # See the matching step in build-macos: drop bundles restored from the
      # cargo cache so the upload globs only match this build's installer.
      - name: Remove stale bundle output
        run: Remove-Item -Recurse -Force -ErrorAction Ignore src-tauri/target/release/bundle

      # With a signing key present, also emit the signed updater artifact
      # (the setup.exe itself is the update payload; a .sig is produced beside
      # it). Single quotes keep PowerShell from touching the JSON.
      - name: Build NSIS installer
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY) {
            cargo tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":true}}'
          } else {
            cargo tauri build --bundles nsis
          }

      - name: Upload installer to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          fail_on_unmatched_files: true

      - name: Stash Windows updater signature
        if: ${{ env.TAURI_SIGNING_PRIVATE_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: updater-sig-windows
          path: src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

      - name: Upload installer as workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: HymnBeam-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  # The Homebrew cask lives in a *separate* repo, so the release commit can't
  # touch it and it was historically bumped by hand. That step was missed for
  # both v0.2.2 and v0.3.0, leaving `brew upgrade --cask hymnbeam` two releases
  # behind for months. This job does it from the DMG that was just published.
  #
  # Requires HOMEBREW_TAP_TOKEN: a fine-grained PAT with Contents: read & write
  # on wanmekwi/homebrew-hymnbeam. Until that secret exists the job warns and
  # succeeds, mirroring how the updater-signing steps stay inert.
  update-homebrew-cask:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos]
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Bump cask to the released DMG
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN not set — cask NOT bumped. Update Casks/hymnbeam.rb by hand."
            exit 0
          fi

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          DMG="HymnBeam_${VERSION}_universal.dmg"

          # Hash the asset as served by the very URL the cask template builds,
          # rather than trusting release metadata — a wrong sha256 here breaks
          # `brew install` for everyone, so it must match what users fetch.
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${DMG}"
          curl -sSfL -o "$DMG" "$URL"
          SHA=$(sha256sum "$DMG" | cut -d' ' -f1)
          echo "sha256(${DMG}) = ${SHA}"

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/wanmekwi/homebrew-hymnbeam.git" tap
          cd tap
          sed -i -E "s|^  version \".*\"|  version \"${VERSION}\"|" Casks/hymnbeam.rb
          sed -i -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" Casks/hymnbeam.rb

          # Re-running a tag (or a manual bump that already landed) is a no-op
          # rather than an empty-commit failure.
          if git diff --quiet; then
            echo "Cask already at ${VERSION}; nothing to do."
            exit 0
          fi

          # Fail loudly if the substitution didn't take — a silently unchanged
          # version would ship a sha that doesn't match its own url.
          grep -qF "version \"${VERSION}\"" Casks/hymnbeam.rb
          grep -qF "sha256 \"${SHA}\"" Casks/hymnbeam.rb

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -aqm "hymnbeam ${VERSION}"
          git push -q origin HEAD
          echo "Cask bumped to ${VERSION}."

  # Runs after both installers are attached: writes the release body from the
  # install-instructions template plus the auto-generated changelog. Done once
  # here (rather than generate_release_notes on each upload step) so the two
  # build jobs can't race and duplicate the notes.
  publish-release-notes:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          sed "s/{VERSION}/${TAG#v}/g" .github/release-notes-template.md > notes.md
          echo "" >> notes.md
          gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" --jq '.body' >> notes.md
          gh release edit "$TAG" --notes-file notes.md

      # Pull down the detached updater signatures the build jobs stashed. When
      # signing isn't configured they were never uploaded, so this finds nothing
      # and the assemble step below skips — leaving the release unchanged.
      - name: Download updater signatures
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: sigs

      # Build the updater manifest the app polls. Signatures are file contents;
      # the download URLs are resolved from the assets already on the release,
      # so no artifact filenames are hard-coded here.
      - name: Assemble and upload latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MAC_SIG_FILE=$(ls sigs/updater-sig-macos/*.app.tar.gz.sig 2>/dev/null | head -1 || true)
          WIN_SIG_FILE=$(ls sigs/updater-sig-windows/*-setup.exe.sig 2>/dev/null | head -1 || true)
          if [ -z "$MAC_SIG_FILE" ] || [ -z "$WIN_SIG_FILE" ]; then
            echo "Updater signatures absent — updater not activated; skipping latest.json."
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          assets=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[].browser_download_url')
          MAC_URL=$(echo "$assets" | grep '\.app\.tar\.gz$' | head -1)
          WIN_URL=$(echo "$assets" | grep -- '-setup\.exe$' | head -1)
          if [ -z "$MAC_URL" ] || [ -z "$WIN_URL" ]; then
            echo "::error::Could not resolve updater asset URLs on the release."
            exit 1
          fi
          jq -n \
            --arg v "${TAG#v}" \
            --arg pd "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg ms "$(cat "$MAC_SIG_FILE")" --arg mu "$MAC_URL" \
            --arg ws "$(cat "$WIN_SIG_FILE")" --arg wu "$WIN_URL" \
            '{
               version: $v,
               notes: "See the release page for details.",
               pub_date: $pd,
               platforms: {
                 "darwin-aarch64": { signature: $ms, url: $mu },
                 "darwin-x86_64":  { signature: $ms, url: $mu },
                 "windows-x86_64": { signature: $ws, url: $wu }
               }
             }' > latest.json
          gh release upload "$TAG" latest.json --clobber
          echo "Published latest.json for $TAG."
